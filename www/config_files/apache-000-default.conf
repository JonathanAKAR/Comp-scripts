#from: https://github.com/NJITICC/NCAE_CyberGames_Prep/blob/main/revProxySetup.md 
<VirtualHost *:80>
    ServerName REPLACE_ME_WITH_DOMAIN

    ProxyPreserveHost On
    ProxyPass / http://localhost:8000/
    ProxyPassReverse / http://localhost:8000/

    # Optional but recommended: allow ACME challenge
    <Location /.well-known/acme-challenge/>
        ProxyPass !
    </Location>
</VirtualHost>

<VirtualHost *:443>
    ServerName REPLACE_ME_WITH_DOMAIN

    ProxyPreserveHost On
    ProxyPass / http://localhost:8000/
    ProxyPassReverse / http://localhost:8000/

    # Let Certbot populate SSL config here
</VirtualHost>

# Enable ModSecurity (if installed)
SecRuleEngine On
