# Reverse Proxy Config (NGINX equivalent)

# HTTP
server {
    listen 80;
    server_name SERVER_NAME_REPLACE;

    # Allow ACME challenge directly (no proxy)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    location / {
        proxy_pass http://localhost:8000;

        # Equivalent to ProxyPreserveHost On
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Security hardening
    server_tokens off;
}

# HTTPS
server {
    listen 443 ssl;
    server_name SERVER_NAME_REPLACE;

    # Certbot will populate these
    ssl_certificate /etc/letsencrypt/live/SERVER_NAME_REPLACE/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/SERVER_NAME_REPLACE/privkey.pem;

    # Basic modern TLS config
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Enable HSTS (optional but recommended)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Allow ACME challenge
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    location / {
        proxy_pass http://localhost:8000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    server_tokens off;
}
